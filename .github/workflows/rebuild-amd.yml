# Rebuilds amd/build with Moodle's own grunt toolchain and commits the result.
# Start it manually: GitHub > Actions > "Rebuild AMD" > "Run workflow".
name: Rebuild AMD

on: workflow_dispatch

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Check out Moodle
        uses: actions/checkout@v4
        with:
          repository: moodle/moodle
          ref: MOODLE_404_STABLE
          path: moodle

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: moodle/.nvmrc

      - name: Build AMD modules
        run: |
          mkdir -p moodle/local
          cp -r plugin moodle/local/fredkichat
          cd moodle
          npm ci
          npx grunt amd --root=local/fredkichat
          cp local/fredkichat/amd/build/* ../plugin/amd/build/

      - name: Commit build files
        run: |
          cd plugin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amd/build
          git diff --cached --quiet || git commit -m "Rebuild AMD modules with grunt"
          git push
